# Dashboard configuration
replicaCount: 1

image:
  repository: ghcr.io/language-operator/dashboard
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 3000

# Gateway API configuration (Traefik native)
gateway:
  enabled: false
  # Name of existing Gateway to attach HTTPRoute to
  gatewayName: ""
  # Namespace of the Gateway (if different from dashboard namespace)
  gatewayNamespace: ""
  # Hostname for the dashboard
  hostname: "dashboard.example.com"
  # TLS configuration
  tls:
    enabled: false
    # Reference to TLS certificate secret
    certificateRef:
      name: ""
      namespace: ""

# Legacy Ingress support (deprecated, use Gateway API instead)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dashboard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: dashboard-tls
  #    hosts:
  #      - dashboard.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# NextAuth configuration
nextAuth:
  secret: ""  # Auto-generated if empty
  url: ""     # Auto-configured based on ingress if empty

# OAuth providers (optional)
oauth:
  google:
    clientId: ""
    clientSecret: ""
  github:
    clientId: ""
    clientSecret: ""

# Feature flags
features:
  saasMode: false
  emailAuth: true
  billing: false
  invites: true

# PostgreSQL subchart configuration
postgresql:
  enabled: true
  auth:
    username: dashboard
    password: ""  # Auto-generated if empty
    database: dashboard
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  volumePermissions:
    enabled: true

# External database configuration (when postgresql.enabled=false)
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  user: dashboard
  password: ""
  database: dashboard
