apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard.fullname" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database URL
  {{- if .Values.externalDatabase.enabled }}
  DATABASE_URL: {{ include "dashboard.databaseUrl" . | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@%s-postgresql:5432/%s?schema=public" .Values.postgresql.auth.username (include "dashboard.fullname" .) .Values.postgresql.auth.database | quote }}
  {{- end }}

  # NextAuth secret
  NEXTAUTH_SECRET: {{ .Values.nextAuth.secret | default (randAlphaNum 32) | quote }}

  # OAuth credentials (if provided)
  {{- if .Values.oauth.google.clientId }}
  GOOGLE_CLIENT_ID: {{ .Values.oauth.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.oauth.google.clientSecret | quote }}
  {{- end }}

  {{- if .Values.oauth.github.clientId }}
  GITHUB_CLIENT_ID: {{ .Values.oauth.github.clientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.oauth.github.clientSecret | quote }}
  {{- end }}
