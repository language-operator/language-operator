{{- if .Values.postgresql.enabled }}
{{- $postgresPassword := .Values.postgresql.auth.password | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard.fullname" . }}-postgresql
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
data:
  password: {{ $postgresPassword | b64enc | quote }}
{{- end }}
