{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard.fullname" . }}-postgresql
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
data:
  password: {{ include "dashboard.postgresqlPassword" . | b64enc | quote }}
{{- end }}
