# Default values for language-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/language-operator/language-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Network isolation configuration
# Controls whether NetworkPolicy resources are created for security isolation
networkIsolation:
  # Enable/disable NetworkPolicy creation for all Language Operator resources
  # When disabled, no NetworkPolicy resources will be created, allowing unrestricted network access
  # When enabled, strict network isolation is enforced for agents, tools, models, and dashboard
  enabled: true

# ServiceAccount configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Service configuration
service:
  type: ClusterIP
  port: 8080
  metricsPort: 8443
  annotations: {}

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity and anti-affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - language-operator
        topologyKey: kubernetes.io/hostname

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Operator configuration
config:
  # Leader election configuration
  leaderElection:
    enabled: true
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s

  # Metrics configuration
  metrics:
    bindAddress: ":8443"
    secure: true

  # Health probe configuration
  health:
    bindAddress: ":8081"

  # Webhook configuration
  webhook:
    enabled: true
    port: 9443
    certDir: /tmp/k8s-webhook-server/serving-certs

  # Logging configuration
  logging:
    level: info
    format: json
    development: false

  # Controller configuration
  controller:
    # Number of concurrent reconcilers per controller
    concurrency: 5
    # Sync period for controller
    syncPeriod: 10m

  # Synthesis rate limiting configuration
  synthesis:
    rateLimits:
      # Maximum synthesis attempts per namespace per hour
      perHour: 500
      # Maximum synthesis attempts per namespace per day
      perDay: 100

  # Self-healing synthesis configuration
  selfHealing:
    # Enable self-healing synthesis for failed agents
    enabled: true
    # Maximum self-healing attempts before marking agent as failed
    maxAttempts: 5
    # Minimum backoff between self-healing attempts
    minBackoff: 1m
    # Maximum backoff between self-healing attempts
    maxBackoff: 16m
    # Number of consecutive failures required to trigger self-healing
    failureThreshold: 2
    # Sanitize logs before passing to LLM (redact secrets)
    sanitizeLogs: true
    # Maximum log lines to extract from crashed containers
    maxLogLines: 100
    # Timeout for log extraction
    logFetchTimeout: 5s

  # Network policy configuration for agent pods
  # These settings control NetworkPolicy rules applied to LanguageAgent, LanguageTool, and LanguageModel pods
  networkPolicy:
    # Kubernetes API server CIDR ranges for agent pod access
    # These CIDRs allow agent pods to reach the Kubernetes API server for event emission and learning integration
    # Configure these to match your cluster's network topology
    apiServerCIDRs:
      # Common cluster service networks where API servers typically reside
      - "10.0.0.0/8"        # Covers most kubeadm clusters (10.96.0.1), k3s (10.43.0.1)
      - "172.16.0.0/12"     # Docker default bridge network, some managed clusters
      - "192.168.0.0/16"    # Local/dev clusters, some node networks
      
    # Additional custom CIDR ranges (empty by default)
    # Use this to add specific network ranges for your environment
    # Example:
    #   - "203.0.113.0/24"  # External API server network
    #   - "198.51.100.0/24" # Load balancer network
    customCIDRs: []

  # Agent runtime security configuration
  # These settings apply to LanguageAgent pods created by the operator
  agentSecurity:
    # Pod security context for agent containers
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000  # langop user (matches agent Dockerfile)
      fsGroup: 101     # langop group
      seccompProfile:
        type: RuntimeDefault

    # Container security context for agent containers
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000  # langop user (matches agent Dockerfile)
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    # Enable tmpfs volumes for read-only filesystem compatibility
    # These volumes allow writes to specific directories while keeping root filesystem read-only
    tmpfsVolumes:
      enabled: true
      # Use memory-backed tmpfs (fast but uses pod memory limit)
      useMemory: true
      volumes:
        # General temporary directory
        - name: tmp
          mountPath: /tmp
        # Ruby bundler cache
        - name: ruby-bundle
          mountPath: /home/langop/.bundle
        # Ruby gem installation directory
        - name: ruby-gem
          mountPath: /home/langop/.gem

  # Watch configuration
  watch:
    # Namespaces to watch (empty means all namespaces)
    namespaces: []

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Rules for the operator's ClusterRole
  rules:
    # Core Kubernetes resources
    - apiGroups:
      - ""
      resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - pods
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ""
      resources:
      - events
      verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
    # Coordination resources for leader election
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Apps resources
    - apiGroups:
      - apps
      resources:
      - deployments
      - replicasets
      - statefulsets
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - apps
      resources:
      - daemonsets
      verbs:
      - get
      - list
      - watch
    # Networking resources
    - apiGroups:
      - networking.k8s.io
      resources:
      - ingresses
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Gateway API resources
    - apiGroups:
      - gateway.networking.k8s.io
      resources:
      - gateways
      verbs:
      - get
      - list
      - watch
    - apiGroups:
      - gateway.networking.k8s.io
      resources:
      - httproutes
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - gateway.networking.k8s.io
      resources:
      - referencegrants
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Policy resources
    - apiGroups:
      - policy
      resources:
      - poddisruptionbudgets
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Autoscaling resources
    - apiGroups:
      - autoscaling
      resources:
      - horizontalpodautoscalers
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Batch resources (for scheduled agents)
    - apiGroups:
      - batch
      resources:
      - jobs
      - cronjobs
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Language Operator CRDs
    - apiGroups:
      - langop.io
      resources:
      - languagetools
      - languagemodels
      - languageagents
      - languageagentversions
      - languagepersonas
      - languageclients
      - languageclusters
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - langop.io
      resources:
      - languagetools/status
      - languagemodels/status
      - languageagents/status
      - languageagentversions/status
      - languagepersonas/status
      - languageclients/status
      - languageclusters/status
      verbs:
      - get
      - update
      - patch
    - apiGroups:
      - langop.io
      resources:
      - languagetools/finalizers
      - languagemodels/finalizers
      - languageagents/finalizers
      - languageagentversions/finalizers
      - languagepersonas/finalizers
      - languageclients/finalizers
      - languageclusters/finalizers
      verbs:
      - update
    # Networking resources for LanguageCluster
    - apiGroups:
      - networking.k8s.io
      resources:
      - networkpolicies
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # PersistentVolumeClaims for agent workspaces
    - apiGroups:
      - ""
      resources:
      - persistentvolumeclaims
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Namespace management for LanguageCluster
    - apiGroups:
      - ""
      resources:
      - namespaces
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # RBAC resources for LanguageCluster and agent ServiceAccounts
    - apiGroups:
      - rbac.authorization.k8s.io
      resources:
      - roles
      - rolebindings
      - clusterrolebindings
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

# Monitoring configuration
monitoring:
  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    # Namespace where ServiceMonitor will be created (defaults to release namespace)
    namespace: ""
    # Additional labels for ServiceMonitor
    labels: {}
    # Interval at which metrics should be scraped
    interval: 30s
    # Timeout for scraping
    scrapeTimeout: 10s

# OpenTelemetry configuration
# Internal Telemetry Stack (enabled by default)
# 
# The Language Operator now includes a complete internal telemetry stack:
# - ClickHouse for data storage (persistent traces/metrics/logs)
# - OpenTelemetry Collector for data ingestion  
# - Direct ClickHouse adapter for learning system queries
#
# This eliminates dependencies on external services like SigNoz.
#
# To disable the telemetry stack entirely:
#   opentelemetry.collector.enabled: false
#   telemetry.clickhouse.enabled: false  
#   telemetry.otelCollector.enabled: false
#   telemetry.queryBackend.enabled: false

# 1. DATA COLLECTION - Where agents/tools/operator send telemetry data
opentelemetry:
  collector:
    # Enable OpenTelemetry data collection (enabled by default with internal stack)
    enabled: true

    # OTLP gRPC endpoint for exporting traces/metrics/logs
    # When telemetry.otelCollector.enabled=true, this automatically points to internal collector
    # Manual override: set to external endpoint if needed
    endpoint: ""

    # Sampling configuration for data collection
    sampling:
      # Trace sampling rate (0.0 to 1.0)
      # 1.0 = sample 100% of traces (recommended for development)
      # 0.1 = sample 10% of traces (recommended for production)
      # 0.01 = sample 1% of traces (high-volume production)
      rate: 1.0

    # Resource attributes for trace identification
    # These attributes help identify and filter traces in your observability platform
    resourceAttributes:
      # Environment identifier (e.g., production, staging, development)
      environment: "production"

      # Kubernetes cluster name (helps when aggregating traces from multiple clusters)
      cluster: "main"

      # Custom resource attributes (key-value pairs)
      # Example:
      #   region: "us-east-1"
      #   team: "platform"
      #   cost_center: "engineering"
      custom: {}

# 2. DATA QUERYING - Where the learning system queries historical telemetry data
telemetry:
  # Internal ClickHouse deployment for telemetry storage
  clickhouse:
    # Enable internal ClickHouse deployment (enabled by default)
    enabled: true
    
    # ClickHouse image configuration
    image:
      tag: "24.1-alpine"
      pullPolicy: IfNotPresent
    
    # Database configuration
    database: "langop"
    
    # Authentication settings
    auth:
      username: "langop"
      # Set password for authentication (optional, uses no auth if empty)
      password: "langop"
    
    # ClickHouse configuration
    config:
      # Log level: trace, debug, information, warning, error
      logLevel: "information"
      # Log all queries for debugging (can be verbose)
      logQueries: false
      # Maximum memory usage in bytes (10GB default)
      maxMemoryUsage: "10000000000"
      # Maximum concurrent queries
      maxConcurrentQueries: 100
    
    # Resource configuration
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    
    # Persistence configuration
    persistence:
      enabled: true
      size: 100Gi
      # Storage class (leave empty for default)
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      # Annotations for PVC
      annotations: {}
    
    # Data retention configuration
    retention:
      # Retention period for traces (7 days = 168 hours)
      traces: "168h"
      # Retention period for metrics (30 days = 720 hours)
      metrics: "720h"
      # Retention period for logs (3 days = 72 hours)
      logs: "72h"
    
    # Service configuration for ClickHouse web UI
    service:
      type: ClusterIP
      port: 8123
      # nodePort: 30123  # Only used if type is NodePort
    
    # Ingress configuration for ClickHouse web UI
    ingress:
      enabled: false
      className: ""
      annotations: {}
        # kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true"
      hosts:
        - host: clickhouse.local
          paths:
            - path: /
              pathType: Prefix
      tls: []
      #  - secretName: clickhouse-tls
      #    hosts:
      #      - clickhouse.local

  # OpenTelemetry Collector for data collection
  otelCollector:
    # Enable OTel Collector deployment (enabled by default)
    enabled: true
    
    # Number of collector replicas for HA
    replicas: 2
    
    # OTel Collector image configuration
    image:
      tag: "0.91.0"
      pullPolicy: IfNotPresent
    
    # Resource configuration
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 512Mi
    
    # Collector configuration
    config:
      # Environment identifier
      environment: "production"
      
      # Batch processing settings
      batchSize: 1024
      batchTimeout: "1s"
      batchMaxSize: 2048
      
      # Memory limits
      memoryLimitMiB: 512
      memorySpikeLimit: 128
      
      # Export timeout
      exportTimeout: "30s"
      
      # Logging configuration
      logLevel: "info"
      metricsLevel: "normal"
      
      # Sampling configuration (optional)
      sampling:
        enabled: false
        rate: 10.0  # 10% sampling rate
      
      # Debug configuration
      debug:
        enabled: false
        verbosity: "normal"
    
    # Node selector
    nodeSelector: {}
    
    # Tolerations
    tolerations: []
    
    # Affinity rules
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                - otel-collector
            topologyKey: kubernetes.io/hostname

  # Internal query backend configuration
  # Uses the internal ClickHouse deployment for learning system queries
  queryBackend:
    # Enable telemetry querying for learning system (enabled by default)
    enabled: true

    # Query configuration
    query:
      # Maximum number of traces to query per request
      maxTraces: 100
      
      # Time range for historical queries
      lookbackPeriod: "24h"
      
      # Query timeout for individual requests  
      timeout: "60s"
    
    # Connection settings to internal ClickHouse
    connection:
      timeout: "30s"
      retryAttempts: 3
      retryBackoff: "1s"

    # Health check configuration
    healthCheck:
      # Enable periodic health checks
      enabled: true
      
      # Health check interval
      interval: "5m"
      
      # Health check timeout
      timeout: "10s"

# Agent-specific data collection configuration
# Allows agents and tools to use different collection settings than the operator
agentTelemetry:
  # OTLP endpoint override for agents and tools
  # If empty, agents inherit the operator's opentelemetry configuration
  # When telemetry.otelCollector.enabled=true, automatically uses internal collector
  endpoint: ""

  # Sampling rate override for agents and tools
  # If null, agents inherit the operator's opentelemetry.collector.sampling.rate
  # Set to a lower rate (e.g., 0.1) to reduce agent trace volume
  # while keeping operator traces at 100% sampling
  samplingRate: null

# CRD installation
crds:
  # Install CRDs as part of the Helm chart
  install: true
  # Keep CRDs on chart uninstall
  keep: true
  # Annotations to add to CRDs
  annotations: {}

# Additional volumes
volumes: []
# - name: tmp
#   emptyDir: {}

# Additional volume mounts
volumeMounts: []
# - name: tmp
#   mountPath: /tmp

# Extra environment variables
# Note: Synthesis is now configured per-agent via ModelRefs in LanguageAgent CRDs
env:
  - name: SELF_HEALING_ENABLED
    value: "{{ .Values.config.selfHealing.enabled }}"
  - name: SELF_HEALING_MAX_ATTEMPTS
    value: "{{ .Values.config.selfHealing.maxAttempts }}"
  - name: SELF_HEALING_FAILURE_THRESHOLD
    value: "{{ .Values.config.selfHealing.failureThreshold }}"

# Extra environment variables from ConfigMap or Secret
envFrom: []
# - configMapRef:
#     name: my-config
# - secretRef:
#     name: my-secret

# Priority class name
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: language-operator

# Pod labels
podLabels: {}

# Service labels
serviceLabels: {}

# Persona Library configuration
personaLibrary:
  # Enable persona library ConfigMaps
  enabled: true
  # List of built-in personas to install
  personas:
    - financial-analyst
    - devops-engineer
    - general-assistant
    - executive-assistant
    - customer-support

# Dashboard configuration
dashboard:
  # Enable the web dashboard
  enabled: true

  # Dashboard image configuration
  image:
    repository: ghcr.io/language-operator/dashboard
    tag: latest
    pullPolicy: Always

  # Dashboard service configuration
  service:
    type: ClusterIP
    port: 3000

  # Dashboard resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Dashboard scaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  # Dashboard deployment configuration
  replicaCount: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Dashboard pod configuration
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false

  # Dashboard service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Legacy Ingress support (deprecated, use Gateway API instead)
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: dashboard.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: dashboard-tls
    #    hosts:
    #      - dashboard.example.com

  # Gateway API configuration (Traefik native)
  gateway:
    enabled: false
    # Name of existing Gateway to attach HTTPRoute to
    gatewayName: ""
    # Namespace of the Gateway (if different from dashboard namespace)
    gatewayNamespace: ""
    # Hostname for the dashboard
    hostname: "dashboard.example.com"
    # TLS configuration
    tls:
      enabled: false
      # Reference to TLS certificate secret
      certificateRef:
        name: ""
        namespace: ""

  # PostgreSQL configuration
  postgresql:
    enabled: true
    auth:
      username: dashboard
      database: dashboard
      # Password auto-generated if empty
      password: ""
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""  # Use default storage class
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # External database configuration (when postgresql.enabled=false)
  externalDatabase:
    enabled: false
    host: ""
    port: 5432
    user: dashboard
    password: ""
    database: dashboard

  # NextAuth configuration
  nextAuth:
    secret: ""  # Auto-generated if empty
    url: ""     # Auto-configured based on ingress if empty

  # OAuth providers (optional)
  oauth:
    google:
      clientId: ""
      clientSecret: ""
    github:
      clientId: ""
      clientSecret: ""

  # Feature flags
  features:
    saasMode: false
    emailAuth: true
    billing: false
    invites: true
    # Control signup access - when true, signups require invitation tokens
    signupsDisabled: false

  # Initial setup configuration (set by CLI install command)
  # Used to create the first admin user when dashboard starts up with an empty database
  initialSetup:
    enabled: false  # CLI will set to true when providing admin credentials
    adminUser:
      name: ""      # CLI will populate with admin's full name
      email: ""     # CLI will populate with admin's email address
      passwordHash: ""  # CLI will populate with bcrypt hash of admin's password

  # NetworkPolicy configuration for network isolation
  networkPolicy:
    # Enable NetworkPolicy creation
    # Auto-detects if CNI supports NetworkPolicy enforcement (Cilium, Calico, etc.)
    enabled: true
    
    # Allow full egress for model discovery (recommended)
    # Enables dashboard to discover models from local/custom endpoints without NetworkPolicy expertise
    # Note: Workloads (agents/tools) maintain strict NetworkPolicy isolation
    allowModelDiscovery: true
    
    # Restrictive mode: only allow specific external access (when allowModelDiscovery: false)
    # Allow external HTTPS access for model provider APIs
    allowExternalHTTPS: true
    
    # Allow external HTTP access (usually not needed for production APIs)
    allowExternalHTTP: false
    
    # Optional: Restrict egress to specific CIDR blocks (when allowModelDiscovery: false)
    # Useful for air-gapped environments or corporate network restrictions
    allowedCIDRs: []
    # Examples:
    # - "10.0.0.0/8"       # Private networks
    # - "172.16.0.0/12"    # Private networks  
    # - "192.168.0.0/16"   # Private networks
    # Note: allowModelDiscovery: true provides equivalent to "0.0.0.0/0" for discovery
    
    # Optional: Allow specific provider endpoints (future enhancement)
    # This will be expanded to support DNS-to-IP resolution
    allowedEndpoints: []
    # Examples:
    # - cidr: "104.18.0.0/15"  # Cloudflare (example for api.openai.com)
    #   port: 443
    # - cidr: "13.107.42.14/32" # Example specific IP
    #   port: 443
