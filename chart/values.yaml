# Default values for language-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/language-operator/language-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Network isolation configuration
# Controls whether NetworkPolicy resources are created for security isolation
networkIsolation:
  # Enable/disable NetworkPolicy creation for all Language Operator resources
  # When disabled, no NetworkPolicy resources will be created, allowing unrestricted network access
  # When enabled, strict network isolation is enforced for agents, tools, models, and dashboard
  enabled: true

# ServiceAccount configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Service configuration
service:
  type: ClusterIP
  port: 8080
  metricsPort: 8443
  annotations: {}

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity and anti-affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - language-operator
        topologyKey: kubernetes.io/hostname

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Operator configuration
config:
  # Leader election configuration
  leaderElection:
    enabled: true
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s

  # Metrics configuration
  metrics:
    bindAddress: ":8443"
    secure: true

  # Health probe configuration
  health:
    bindAddress: ":8081"

  # Webhook configuration
  webhook:
    enabled: true
    port: 9443
    certDir: /tmp/k8s-webhook-server/serving-certs

  # Logging configuration
  logging:
    level: info
    format: json
    development: false

  # Controller configuration
  controller:
    # Number of concurrent reconcilers per controller
    concurrency: 5
    # Sync period for controller
    syncPeriod: 10m

  # Network policy configuration for agent pods
  # These settings control NetworkPolicy rules applied to LanguageAgent, LanguageTool, and LanguageModel pods
  networkPolicy:
    # Kubernetes API server CIDR ranges for agent pod access
    # These CIDRs allow agent pods to reach the Kubernetes API server for event emission and learning integration
    # Configure these to match your cluster's network topology
    apiServerCIDRs:
      # Common cluster service networks where API servers typically reside
      - "10.0.0.0/8"        # Covers most kubeadm clusters (10.96.0.1), k3s (10.43.0.1)
      - "172.16.0.0/12"     # Docker default bridge network, some managed clusters
      - "192.168.0.0/16"    # Local/dev clusters, some node networks
      
    # Additional custom CIDR ranges (empty by default)
    # Use this to add specific network ranges for your environment
    # Example:
    #   - "203.0.113.0/24"  # External API server network
    #   - "198.51.100.0/24" # Load balancer network
    customCIDRs: []

  # Watch configuration
  watch:
    # Namespaces to watch (empty means all namespaces)
    namespaces: []

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Rules for the operator's ClusterRole
  rules:
    # Core Kubernetes resources
    - apiGroups:
      - ""
      resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - pods
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - ""
      resources:
      - events
      verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
    # Coordination resources for leader election
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Apps resources
    - apiGroups:
      - apps
      resources:
      - deployments
      - replicasets
      - statefulsets
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - apps
      resources:
      - daemonsets
      verbs:
      - get
      - list
      - watch
    # Networking resources
    - apiGroups:
      - networking.k8s.io
      resources:
      - ingresses
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Gateway API resources
    - apiGroups:
      - gateway.networking.k8s.io
      resources:
      - gateways
      verbs:
      - get
      - list
      - watch
    - apiGroups:
      - gateway.networking.k8s.io
      resources:
      - httproutes
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - gateway.networking.k8s.io
      resources:
      - referencegrants
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Policy resources
    - apiGroups:
      - policy
      resources:
      - poddisruptionbudgets
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Autoscaling resources
    - apiGroups:
      - autoscaling
      resources:
      - horizontalpodautoscalers
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Batch resources (for scheduled agents)
    - apiGroups:
      - batch
      resources:
      - jobs
      - cronjobs
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Language Operator CRDs
    - apiGroups:
      - langop.io
      resources:
      - languagetools
      - languagemodels
      - languageagents
      - languagepersonas
      - languageclusters
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - langop.io
      resources:
      - languagetools/status
      - languagemodels/status
      - languageagents/status
      - languagepersonas/status
      - languageclusters/status
      verbs:
      - get
      - update
      - patch
    - apiGroups:
      - langop.io
      resources:
      - languagetools/finalizers
      - languagemodels/finalizers
      - languageagents/finalizers
      - languagepersonas/finalizers
      - languageclusters/finalizers
      verbs:
      - update
    # Networking resources for LanguageCluster
    - apiGroups:
      - networking.k8s.io
      resources:
      - networkpolicies
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # PersistentVolumeClaims for agent workspaces
    - apiGroups:
      - ""
      resources:
      - persistentvolumeclaims
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # Namespace management for LanguageCluster
    - apiGroups:
      - ""
      resources:
      - namespaces
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    # RBAC resources for LanguageCluster and agent ServiceAccounts
    - apiGroups:
      - rbac.authorization.k8s.io
      resources:
      - roles
      - rolebindings
      - clusterrolebindings
      verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

# Monitoring configuration
monitoring:
  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    # Namespace where ServiceMonitor will be created (defaults to release namespace)
    namespace: ""
    # Additional labels for ServiceMonitor
    labels: {}
    # Interval at which metrics should be scraped
    interval: 30s
    # Timeout for scraping
    scrapeTimeout: 10s

# CRD installation
crds:
  # Install CRDs as part of the Helm chart
  install: true
  # Keep CRDs on chart uninstall
  keep: true
  # Annotations to add to CRDs
  annotations: {}

# Additional volumes
volumes: []
# - name: tmp
#   emptyDir: {}

# Additional volume mounts
volumeMounts: []
# - name: tmp
#   mountPath: /tmp

# Extra environment variables
env: []

# Extra environment variables from ConfigMap or Secret
envFrom: []
# - configMapRef:
#     name: my-config
# - secretRef:
#     name: my-secret

# Priority class name
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: language-operator

# Pod labels
podLabels: {}

# Service labels
serviceLabels: {}


# Dashboard configuration
dashboard:
  # Enable the web dashboard
  enabled: true

  # Dashboard image configuration
  image:
    repository: ghcr.io/language-operator/dashboard
    tag: latest
    pullPolicy: Always

  # Dashboard service configuration
  service:
    type: ClusterIP
    port: 3000

  # Dashboard resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Dashboard scaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  # Dashboard deployment configuration
  replicaCount: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Dashboard pod configuration
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false

  # Dashboard service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Legacy Ingress support (deprecated, use Gateway API instead)
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: dashboard.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: dashboard-tls
    #    hosts:
    #      - dashboard.example.com

  # Gateway API configuration (Traefik native)
  gateway:
    enabled: false
    # Name of existing Gateway to attach HTTPRoute to
    gatewayName: ""
    # Namespace of the Gateway (if different from dashboard namespace)
    gatewayNamespace: ""
    # Hostname for the dashboard
    hostname: "dashboard.example.com"
    # TLS configuration
    tls:
      enabled: false
      # Reference to TLS certificate secret
      certificateRef:
        name: ""
        namespace: ""

  # PostgreSQL configuration
  postgresql:
    enabled: true
    auth:
      username: dashboard
      database: dashboard
      # Password auto-generated if empty
      password: ""
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""  # Use default storage class
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # External database configuration (when postgresql.enabled=false)
  externalDatabase:
    enabled: false
    host: ""
    port: 5432
    user: dashboard
    password: ""
    database: dashboard

  # NextAuth configuration
  nextAuth:
    secret: ""  # Auto-generated if empty
    url: ""     # Auto-configured based on ingress if empty

  # OAuth providers (optional)
  oauth:
    google:
      clientId: ""
      clientSecret: ""
    github:
      clientId: ""
      clientSecret: ""

  # Feature flags
  features:
    saasMode: false
    emailAuth: true
    billing: false
    invites: true
    # Control signup access - when true, signups require invitation tokens
    signupsDisabled: false

  # Organization namespace configuration
  organization:
    # Prefix for organization namespaces (default: "language-operator-")
    namespacePrefix: "language-operator-"

  # Initial setup configuration (set by CLI install command)
  # Used to create the first admin user when dashboard starts up with an empty database
  initialSetup:
    enabled: false  # CLI will set to true when providing admin credentials
    adminUser:
      name: ""      # CLI will populate with admin's full name
      email: ""     # CLI will populate with admin's email address
      passwordHash: ""  # CLI will populate with bcrypt hash of admin's password

  # NetworkPolicy configuration for network isolation
  networkPolicy:
    # Enable NetworkPolicy creation
    # Auto-detects if CNI supports NetworkPolicy enforcement (Cilium, Calico, etc.)
    enabled: true
    
    # Allow full egress for model discovery (recommended)
    # Enables dashboard to discover models from local/custom endpoints without NetworkPolicy expertise
    # Note: Workloads (agents/tools) maintain strict NetworkPolicy isolation
    allowModelDiscovery: true
    
    # Restrictive mode: only allow specific external access (when allowModelDiscovery: false)
    # Allow external HTTPS access for model provider APIs
    allowExternalHTTPS: true
    
    # Allow external HTTP access (usually not needed for production APIs)
    allowExternalHTTP: false
    
    # Optional: Restrict egress to specific CIDR blocks (when allowModelDiscovery: false)
    # Useful for air-gapped environments or corporate network restrictions
    allowedCIDRs: []
    # Examples:
    # - "10.0.0.0/8"       # Private networks
    # - "172.16.0.0/12"    # Private networks  
    # - "192.168.0.0/16"   # Private networks
    # Note: allowModelDiscovery: true provides equivalent to "0.0.0.0/0" for discovery
    
    # Optional: Allow specific provider endpoints (future enhancement)
    # This will be expanded to support DNS-to-IP resolution
    allowedEndpoints: []
    # Examples:
    # - cidr: "104.18.0.0/15"  # Cloudflare (example for api.openai.com)
    #   port: 443
    # - cidr: "13.107.42.14/32" # Example specific IP
    #   port: 443
