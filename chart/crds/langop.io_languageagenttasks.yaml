              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LanguageAgentTaskSpec defines the desired state of LanguageAgentTask
            properties:
              agentRef:
                description: AgentRef is the name of the LanguageAgent that owns this
                  task
                type: string
              contextId:
                description: ContextID is the A2A context (conversation session) this
                  task belongs to
                type: string
              initialMessage:
                description: InitialMessage is the message that created this task
                type: string
              taskId:
                description: TaskID is the A2A task ID assigned by the agent
