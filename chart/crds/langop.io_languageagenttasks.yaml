                  properties:
                    artifactId:
                      description: ArtifactID is the A2A artifact identifier
                      type: string
                    description:
                      description: Description is a human-readable description of
                        the artifact
                      type: string
                    name:
                      description: Name identifies the artifact
                      type: string
                    type:
                      description: Type is the MIME type of the artifact content
                      type: string
                  type: object
                type: array
              authRequired:
                description: AuthRequired holds details when the task is paused awaiting
                  credentials
                properties:
                  description:
                    description: Description is the agent's explanation of why credentials
                      are needed
                    type: string
                  scheme:
                    description: Scheme is the authentication scheme required (e.g.
                      Bearer, APIKey)
                    type: string
                  since:
                    description: Since is when the task entered auth-required state
                    format: date-time
                    type: string
                type: object
