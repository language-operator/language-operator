{{- if .Values.runtimes.claudeCode.enabled -}}
apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: claude-code
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  image: ghcr.io/language-operator/claude-code-server:latest

  claudeCode:
    enabled: true

  ports:
    - name: http
      port: 8080
      protocol: TCP
      expose: true

  workspace:
    size: 10Gi
    mountPath: /workspace

  deployment:
    initContainers:
      - name: claude-code-adapter
        image: ghcr.io/language-operator/claude-code-adapter:latest
        # MODEL_ENDPOINT and LLM_MODEL are injected by the operator.
        # AGENT_NAME is injected by the operator for agent card identity.
        volumeMounts:
          - name: claude-home
            mountPath: /root
          - name: workspace
            mountPath: /workspace

    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

    env:
      - name: HOME
        value: /root   # Claude Code stores config in $HOME/.claude

    volumes:
      - name: claude-home
        emptyDir: {}   # Regenerated by adapter on each start; config is in settings.json

    volumeMounts:
      - name: claude-home
        mountPath: /root

    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
{{- end }}
