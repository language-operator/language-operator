{{- if .Values.runtimes.opencode.enabled -}}
apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: opencode
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  image: ghcr.io/anomalyco/opencode:latest

  port: 3000

  workspace:
    size: 10Gi
    mountPath: /workspace

  deployment:
    # opencode web starts the server headlessly in containers (browser launch fails silently).
    # Both web and serve share the same HTTP API; web also serves the browser UI.
    args: ["web", "--hostname", "0.0.0.0", "--port", "3000"]

    initContainers:
      - name: opencode-adapter
        image: ghcr.io/language-operator/opencode-adapter:latest
        # MODEL_ENDPOINTS and LLM_MODEL are injected by the operator.
        # The adapter writes /etc/opencode/opencode.jsonc with provider + MCP config.
        volumeMounts:
          - name: opencode-config
            mountPath: /etc/opencode

    livenessProbe:
      tcpSocket:
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3

    readinessProbe:
      tcpSocket:
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

    env:
      # The image sets WorkingDir=/ with no HOME; redirect all writable paths to /workspace
      - name: HOME
        value: /workspace
      # SQLite session DB and other opencode state lives under $XDG_DATA_HOME/opencode
      - name: XDG_DATA_HOME
        value: /workspace/.local/share
      # Bun writes a runtime cache here; root fs is read-only so redirect to workspace
      - name: XDG_CACHE_HOME
        value: /workspace/.cache
      # Tell opencode where to find the config written by the init container
      - name: OPENCODE_CONFIG_DIR
        value: /etc/opencode

    volumes:
      - name: opencode-config
        emptyDir: {}

    volumeMounts:
      - name: opencode-config
        mountPath: /etc/opencode

    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
{{- end }}
