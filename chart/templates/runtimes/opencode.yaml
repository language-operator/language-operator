{{- if .Values.runtimes.opencode.enabled -}}
apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: opencode
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  image: ghcr.io/anomalyco/opencode:latest

  opencode:
    enabled: true

  ports:
    - name: http
      port: 3000
      protocol: TCP
      expose: true

  workspace:
    size: 10Gi
    mountPath: /workspace

  deployment:
    # Pre-seed /workspace as the default project so the picker is bypassed on first launch.
    # opencode db creates and migrates the DB if it doesn't exist yet (fresh PVC).
    # INSERT OR IGNORE is idempotent — safe to run on every pod start.
    command: ["/bin/sh", "-c"]
    args: ["opencode db \"INSERT OR IGNORE INTO project (id, worktree, vcs, time_created, time_updated, sandboxes) VALUES ('workspace', '/workspace', null, (strftime('%s','now')*1000), (strftime('%s','now')*1000), '[]')\" 2>/dev/null || true; exec opencode web --hostname 0.0.0.0 --port 3000"]

    initContainers:
      - name: opencode-adapter
        image: ghcr.io/language-operator/opencode-adapter:latest
        # MODEL_ENDPOINT and LLM_MODEL are injected by the operator.
        # The adapter writes /etc/opencode/opencode.jsonc with provider + MCP config.
        volumeMounts:
          - name: opencode-config
            mountPath: /etc/opencode

    livenessProbe:
      tcpSocket:
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3

    readinessProbe:
      tcpSocket:
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

    env:
      # The image sets WorkingDir=/ with no HOME; redirect all writable paths to /workspace
      - name: HOME
        value: /workspace
      # SQLite session DB and other opencode state lives under $XDG_DATA_HOME/opencode
      - name: XDG_DATA_HOME
        value: /workspace/.local/share
      # Bun writes a runtime cache here; root fs is read-only so redirect to workspace
      - name: XDG_CACHE_HOME
        value: /workspace/.cache
      # Tell opencode where to find the config written by the init container
      - name: OPENCODE_CONFIG_DIR
        value: /etc/opencode

    volumes:
      - name: opencode-config
        emptyDir: {}

    volumeMounts:
      - name: opencode-config
        mountPath: /etc/opencode

    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
{{- end }}
