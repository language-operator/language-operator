{{- if .Values.runtimes.openclaw.enabled -}}
apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: openclaw
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  image: ghcr.io/openclaw/openclaw:latest

  openclaw:
    enabled: true

  # openclaw gateway binds to loopback (ws://127.0.0.1:18789);
  # kubelet httpGet probes cannot reach it, so no liveness/readiness probes here.
  ports:
    - name: gateway
      port: 18789
      protocol: TCP
      expose: true

  workspace:
    size: 10Gi
    mountPath: /workspace

  deployment:
    initContainers:
      - name: openclaw-adapter
        image: ghcr.io/language-operator/openclaw-adapter:latest
        # MODEL_ENDPOINTS and LLM_MODEL are injected by the operator.
        # The adapter uses them to configure openclaw's provider settings.
        env:
          - name: OPENCLAW_STATE_DIR
            value: /workspace/.openclaw
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    env:
      - name: OPENCLAW_HOME
        value: /workspace   # openclaw uses $OPENCLAW_HOME/.openclaw as its state dir

    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
{{- end }}
