{{- if .Values.config.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "language-operator.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: {{ .Values.config.webhook.port }}
    protocol: TCP
    name: webhook
  selector:
    {{- include "language-operator.selectorLabels" . | nindent 4 }}
    # Exclude components like otel-collector that also have the operator labels
    app.kubernetes.io/component: operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "language-operator.fullname" . }}-mutating-webhook
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
  {{- if .Values.config.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "language-operator.fullname" . }}-webhook-cert
  {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "language-operator.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /mutate-langop-io-v1alpha1-languageagent
  failurePolicy: Fail
  name: mlanguageagent.kb.io
  rules:
  - apiGroups:
    - langop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - languageagents
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "language-operator.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /mutate-langop-io-v1alpha1-languagetool
  failurePolicy: Fail
  name: mlanguagetool.kb.io
  rules:
  - apiGroups:
    - langop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - languagetools
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "language-operator.fullname" . }}-validating-webhook
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
  {{- if .Values.config.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "language-operator.fullname" . }}-webhook-cert
  {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "language-operator.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-langop-io-v1alpha1-languageagent
  failurePolicy: Fail
  name: vlanguageagent.kb.io
  rules:
  - apiGroups:
    - langop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - languageagents
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "language-operator.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-langop-io-v1alpha1-languagetool
  failurePolicy: Fail
  name: vlanguagetool.kb.io
  rules:
  - apiGroups:
    - langop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - languagetools
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "language-operator.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-langop-io-v1alpha1-languagemodel
  failurePolicy: Fail
  name: vlanguagemodel.kb.io
  rules:
  - apiGroups:
    - langop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - languagemodels
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "language-operator.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /validate-langop-io-v1alpha1-languagepersona
  failurePolicy: Fail
  name: vlanguagepersona.kb.io
  rules:
  - apiGroups:
    - langop.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - languagepersonas
  sideEffects: None
{{- if .Values.config.webhook.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "language-operator.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
spec:
  dnsNames:
  - {{ include "language-operator.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
  - {{ include "language-operator.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "language-operator.fullname" . }}-selfsigned-issuer
  secretName: {{ include "language-operator.fullname" . }}-webhook-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "language-operator.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
{{- end }}
