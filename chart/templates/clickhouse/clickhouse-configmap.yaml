{{- if .Values.telemetry.clickhouse.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "language-operator.fullname" . }}-clickhouse-config
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  otel.xml: |
    <clickhouse>
        <!-- Listen on all interfaces -->
        <listen_host>0.0.0.0</listen_host>
        
        <!-- OpenTelemetry settings -->
        <opentelemetry>
            <console>false</console>
            <level>information</level>
        </opentelemetry>
        
        <!-- Logging configuration -->
        <logger>
            <level>{{ .Values.telemetry.clickhouse.config.logLevel | default "information" }}</level>
            <console>true</console>
            <log_queries>{{ .Values.telemetry.clickhouse.config.logQueries | default "false" }}</log_queries>
        </logger>
        
        <!-- Memory and performance settings -->
        <max_memory_usage>{{ .Values.telemetry.clickhouse.config.maxMemoryUsage | default "10000000000" }}</max_memory_usage>
        <max_concurrent_queries>{{ .Values.telemetry.clickhouse.config.maxConcurrentQueries | default "100" }}</max_concurrent_queries>
        
        <!-- Data retention settings -->
        <merge_tree>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </merge_tree>
    </clickhouse>

---
{{- if .Values.telemetry.clickhouse.auth.password }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "language-operator.fullname" . }}-clickhouse-users
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  users.xml: |
    <clickhouse>
        <users>
            <{{ .Values.telemetry.clickhouse.auth.username | default "default" }}>
                <password>{{ .Values.telemetry.clickhouse.auth.password }}</password>
                <profile>default</profile>
                <quota>default</quota>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <grants>
                    <query>GRANT ALL ON {{ .Values.telemetry.clickhouse.database | default "otel" }}.* TO {{ .Values.telemetry.clickhouse.auth.username | default "default" }}</query>
                </grants>
            </{{ .Values.telemetry.clickhouse.auth.username | default "default" }}>
        </users>
    </clickhouse>
{{- end }}
{{- end }}