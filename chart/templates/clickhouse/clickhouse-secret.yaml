{{- if .Values.telemetry.clickhouse.enabled }}
{{- if .Values.telemetry.clickhouse.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "language-operator.fullname" . }}-clickhouse
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
type: Opaque
data:
  password: {{ .Values.telemetry.clickhouse.auth.password | b64enc }}
{{- end }}
{{- end }}