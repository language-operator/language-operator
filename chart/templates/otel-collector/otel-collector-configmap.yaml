{{- if .Values.telemetry.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "language-operator.fullname" . }}-otel-collector-config
  labels:
    {{- include "language-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  config.yaml: |
    # OpenTelemetry Collector configuration for ClickHouse
    
    receivers:
      # OTLP receiver for gRPC and HTTP
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "*"
              allowed_headers:
                - "*"
      
      # Self-monitoring
      prometheus/internal:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['localhost:8888']

    processors:
      # Batch processor for performance
      batch:
        send_batch_size: {{ .Values.telemetry.otelCollector.config.batchSize | default 1024 }}
        timeout: {{ .Values.telemetry.otelCollector.config.batchTimeout | default "1s" }}
        send_batch_max_size: {{ .Values.telemetry.otelCollector.config.batchMaxSize | default 2048 }}
      
      # Memory limiter to prevent OOM
      memory_limiter:
        limit_mib: {{ .Values.telemetry.otelCollector.config.memoryLimitMiB | default 512 }}
        spike_limit_mib: {{ .Values.telemetry.otelCollector.config.memorySpikeLimit | default 128 }}
      
      # Resource processor to add standard attributes
      resource:
        attributes:
          - key: deployment.environment
            value: {{ .Values.telemetry.otelCollector.config.environment | default "production" }}
            action: upsert
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: upsert
          - key: k8s.cluster.name
            value: {{ .Values.opentelemetry.collector.resourceAttributes.cluster | default "main" }}
            action: upsert
      
      # Sampling processor for high-volume environments
      {{- if .Values.telemetry.otelCollector.config.sampling.enabled }}
      probabilistic_sampler:
        sampling_percentage: {{ .Values.telemetry.otelCollector.config.sampling.rate | default 10.0 }}
      {{- end }}

    exporters:
      # ClickHouse exporter for traces
      clickhouse:
        endpoint: ${CLICKHOUSE_ENDPOINT}
        database: ${CLICKHOUSE_DATABASE}
        username: ${CLICKHOUSE_USERNAME}
        {{- if .Values.telemetry.clickhouse.auth.password }}
        password: ${CLICKHOUSE_PASSWORD}
        {{- end }}
        ttl: {{ .Values.telemetry.clickhouse.retention.traces | default "168h" }}
        traces_table_name: otel_traces
        timeout: {{ .Values.telemetry.otelCollector.config.exportTimeout | default "30s" }}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      
      # ClickHouse exporter for logs
      clickhouse/logs:
        endpoint: ${CLICKHOUSE_ENDPOINT}
        database: ${CLICKHOUSE_DATABASE}
        username: ${CLICKHOUSE_USERNAME}
        {{- if .Values.telemetry.clickhouse.auth.password }}
        password: ${CLICKHOUSE_PASSWORD}
        {{- end }}
        ttl: {{ .Values.telemetry.clickhouse.retention.logs | default "72h" }}
        logs_table_name: otel_logs
        timeout: {{ .Values.telemetry.otelCollector.config.exportTimeout | default "30s" }}
      
      # ClickHouse exporter for metrics
      clickhouse/metrics:
        endpoint: ${CLICKHOUSE_ENDPOINT}
        database: ${CLICKHOUSE_DATABASE}
        username: ${CLICKHOUSE_USERNAME}
        {{- if .Values.telemetry.clickhouse.auth.password }}
        password: ${CLICKHOUSE_PASSWORD}
        {{- end }}
        ttl: {{ .Values.telemetry.clickhouse.retention.metrics | default "720h" }}
        metrics_table_name: otel_metrics
        timeout: {{ .Values.telemetry.otelCollector.config.exportTimeout | default "30s" }}
      
      {{- if .Values.telemetry.otelCollector.config.debug.enabled }}
      # Debug exporter for troubleshooting
      debug:
        verbosity: {{ .Values.telemetry.otelCollector.config.debug.verbosity | default "normal" }}
        sampling_initial: 2
        sampling_thereafter: 500
      {{- end }}

    extensions:
      # Health check extension
      health_check:
        endpoint: 0.0.0.0:13133
      
      # pprof for performance debugging
      pprof:
        endpoint: localhost:1777
      
      # zpages for internal state
      zpages:
        endpoint: localhost:55679

    service:
      extensions: [health_check, pprof, zpages]
      
      pipelines:
        # Traces pipeline
        traces:
          receivers: [otlp]
          processors: 
            - memory_limiter
            - resource
            {{- if .Values.telemetry.otelCollector.config.sampling.enabled }}
            - probabilistic_sampler
            {{- end }}
            - batch
          exporters: 
            - clickhouse
            {{- if .Values.telemetry.otelCollector.config.debug.enabled }}
            - debug
            {{- end }}
        
        # Metrics pipeline
        metrics:
          receivers: [otlp, prometheus/internal]
          processors: [memory_limiter, resource, batch]
          exporters: 
            - clickhouse/metrics
            {{- if .Values.telemetry.otelCollector.config.debug.enabled }}
            - debug
            {{- end }}
        
        # Logs pipeline
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: 
            - clickhouse/logs
            {{- if .Values.telemetry.otelCollector.config.debug.enabled }}
            - debug
            {{- end }}
      
      # Telemetry configuration
      telemetry:
        logs:
          level: {{ .Values.telemetry.otelCollector.config.logLevel | default "info" }}
        metrics:
          address: 0.0.0.0:8888
          level: {{ .Values.telemetry.otelCollector.config.metricsLevel | default "normal" }}
{{- end }}