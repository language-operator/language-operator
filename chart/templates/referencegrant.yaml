{{- if and .Values.dashboard.gateway.enabled .Values.dashboard.gateway.gatewayNamespace (ne .Values.dashboard.gateway.gatewayNamespace .Release.Namespace) -}}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: {{ .Values.dashboard.gateway.gatewayNamespace }}
  to:
  - group: ""
    kind: Service
    name: {{ include "dashboard.fullname" . }}
{{- end }}
