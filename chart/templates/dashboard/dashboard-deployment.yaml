{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dashboard.fullname" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.dashboard.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/dashboard/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dashboard.selectorLabels" . | nindent 8 }}
        langop.io/kind: Dashboard
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command: ['sh', '-c']
        args:
        - |
          echo "⏳ Waiting for PostgreSQL to be ready..."
          {{- if not .Values.dashboard.externalDatabase.enabled }}
          export PGPASSWORD="{{ include "dashboard.postgresqlPassword" . }}"
          until pg_isready -h "{{ include "dashboard.fullname" . }}-postgresql" -p 5432 -U "{{ .Values.dashboard.postgresql.auth.username }}" -d "{{ .Values.dashboard.postgresql.auth.database }}"; do
            echo "PostgreSQL not ready, waiting 2s..."
            sleep 2
          done
          {{- else }}
          # For external database, extract details from DATABASE_URL
          until psql "$DATABASE_URL" -c "SELECT 1;" > /dev/null 2>&1; do
            echo "External database not ready, waiting 2s..."
            sleep 2
          done
          {{- end }}
          echo "✅ PostgreSQL is ready!"
        env:
        {{- if not .Values.dashboard.externalDatabase.enabled }}
        - name: PGUSER
          value: "{{ .Values.dashboard.postgresql.auth.username }}"
        - name: PGDATABASE  
          value: "{{ .Values.dashboard.postgresql.auth.database }}"
        {{- else }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: DATABASE_URL
        {{- end }}
      - name: db-migrate
        image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
        command: ['sh', '-c']
        args:
        - |
          echo "Running database migrations..."

          # Note: Prisma client is already generated at build time
          # We only need to run migrations

          echo "Deploying migrations..."

          # Handle the case where the database schema exists but migrations weren't tracked
          # This can happen if the database was initialized with 'db push' instead of 'migrate deploy'
          npx prisma migrate deploy 2>&1 | tee /tmp/migrate.log
          EXIT_CODE=$?

          # Check for P3005 error (database not empty)
          if grep -q "P3005" /tmp/migrate.log; then
            echo "Database schema exists but migrations not tracked. Resolving..."
            # Mark all pending migrations as applied
            npx prisma migrate resolve --applied 20241210_000000_init
            # Try deploy again
            npx prisma migrate deploy
          # Check for P3009 error (failed migration)
          elif grep -q "P3009" /tmp/migrate.log; then
            echo "Found failed migration. Resolving..."
            # Hardcode the known failed migration name for now
            FAILED_MIGRATION="20251224210132_add_conversation_models"
            echo "Failed migration: $FAILED_MIGRATION"
            # Mark the failed migration as rolled back
            npx prisma migrate resolve --rolled-back "$FAILED_MIGRATION"
            # Try deploy again
            npx prisma migrate deploy
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Migration failed with unexpected error (exit code: $EXIT_CODE)"
            cat /tmp/migrate.log
            exit $EXIT_CODE
          fi

          echo "Database migrations completed successfully"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: DATABASE_URL
        {{- if not .Values.dashboard.externalDatabase.enabled }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}-postgresql
              key: password
        {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: DATABASE_URL
        {{- if not .Values.dashboard.externalDatabase.enabled }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}-postgresql
              key: password
        {{- end }}
        - name: NEXTAUTH_URL
          value: {{ .Values.dashboard.nextAuth.url | default (printf "http://%s" (index .Values.dashboard.ingress.hosts 0).host) | quote }}
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: NEXTAUTH_SECRET
        {{- if .Values.telemetry.clickhouse.enabled }}
        - name: CLICKHOUSE_URL
          value: "http://{{ include "language-operator.fullname" . }}-clickhouse:8123"
        - name: CLICKHOUSE_DATABASE
          value: {{ .Values.telemetry.clickhouse.database | default "langop" | quote }}
        - name: CLICKHOUSE_USERNAME
          value: {{ .Values.telemetry.clickhouse.auth.username | default "langop" | quote }}
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "language-operator.fullname" . }}-clickhouse
              key: password
        {{- end }}
        {{- if .Values.dashboard.oauth.google.clientId }}
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: GOOGLE_CLIENT_SECRET
        {{- end }}
        {{- if .Values.dashboard.oauth.github.clientId }}
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: GITHUB_CLIENT_SECRET
        {{- end }}
        - name: NEXT_PUBLIC_SAAS_MODE
          value: {{ .Values.dashboard.features.saasMode | quote }}
        - name: NEXT_PUBLIC_EMAIL_AUTH_ENABLED
          value: {{ .Values.dashboard.features.emailAuth | quote }}
        - name: NEXT_PUBLIC_BILLING_ENABLED
          value: {{ .Values.dashboard.features.billing | quote }}
        - name: NEXT_PUBLIC_INVITES_ENABLED
          value: {{ .Values.dashboard.features.invites | quote }}
        - name: LANGOP_SIGNUPS_DISABLED
          value: {{ .Values.dashboard.features.signupsDisabled | quote }}
        - name: LANGOP_ORGANIZATION_NAMESPACE_PREFIX
          value: {{ .Values.dashboard.organization.namespacePrefix | quote }}
        {{- if .Values.dashboard.initialSetup.enabled }}
        # Initial setup environment variables (set by CLI install command)
        - name: LANGOP_INIT_ADMIN_NAME
          value: {{ .Values.dashboard.initialSetup.adminUser.name | quote }}
        - name: LANGOP_INIT_ADMIN_EMAIL
          value: {{ .Values.dashboard.initialSetup.adminUser.email | quote }}
        - name: LANGOP_INIT_ADMIN_PASSWORD_HASH
          value: {{ .Values.dashboard.initialSetup.adminUser.passwordHash | quote }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
