{{- if .Values.dashboard.enabled }}
{{- if .Values.dashboard.initialSetup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dashboard.fullname" . }}-init
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-migrations
        image: postgres:15-alpine
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for database migrations to complete..."
          export PGPASSWORD="{{ include "dashboard.postgresqlPassword" . }}"
          
          until psql -h "{{ include "dashboard.fullname" . }}-postgresql" -p 5432 -U "{{ .Values.dashboard.postgresql.auth.username }}" -d "{{ .Values.dashboard.postgresql.auth.database }}" -c "SELECT 1 FROM _prisma_migrations LIMIT 1;" > /dev/null 2>&1; do
            echo "Database migrations not complete, waiting..."
            sleep 5
          done
          echo "Database migrations completed - ready for tenant initialization!"
      containers:
      - name: dashboard-init
        image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
        command: ["npm", "run", "initialize-tenant"]
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "dashboard.fullname" . }}
              key: DATABASE_URL
        # Initial setup environment variables
        - name: LANGOP_INIT_ADMIN_NAME
          value: {{ .Values.dashboard.initialSetup.adminUser.name | quote }}
        - name: LANGOP_INIT_ADMIN_EMAIL
          value: {{ .Values.dashboard.initialSetup.adminUser.email | quote }}
        - name: LANGOP_INIT_ADMIN_PASSWORD_HASH
          value: {{ .Values.dashboard.initialSetup.adminUser.passwordHash | quote }}
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
{{- end }}
{{- end }}