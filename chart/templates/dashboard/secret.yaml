{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard.fullname" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database URL
  DATABASE_URL: {{ include "dashboard.databaseUrl" . | quote }}

  # NextAuth secret - use a deterministic value based on release name to prevent regeneration
  NEXTAUTH_SECRET: {{ .Values.dashboard.nextAuth.secret | default (printf "%s-nextauth-secret" .Release.Name | sha256sum) | quote }}

  # OAuth credentials (if provided)
  {{- if .Values.dashboard.oauth.google.clientId }}
  GOOGLE_CLIENT_ID: {{ .Values.dashboard.oauth.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.dashboard.oauth.google.clientSecret | quote }}
  {{- end }}

  {{- if .Values.dashboard.oauth.github.clientId }}
  GITHUB_CLIENT_ID: {{ .Values.dashboard.oauth.github.clientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.dashboard.oauth.github.clientSecret | quote }}
  {{- end }}
{{- end }}
