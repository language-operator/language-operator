{{- if .Values.dashboard.enabled }}
{{- if .Values.dashboard.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dashboard.fullname" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
rules:
# CRD access for all language-operator resources
- apiGroups: ["langop.io"]
  resources:
  - languageagents
  - languageagentversions
  - languagemodels
  - languagetools
  - languagepersonas
  - languageclusters
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Namespace management for organizations
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "create", "update", "patch"]

# Pod access for debugging and workspace file management
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["get", "list", "create", "delete"]

# ResourceQuota management for organization plan enforcement
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]

# PersistentVolumeClaim access for workspace file management
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]

# Events access for audit logging and status information
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]

# Job and CronJob access for manual agent execution
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "create", "delete"]
{{- end }}
{{- end }}
