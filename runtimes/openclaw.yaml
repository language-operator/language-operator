---
# Standard LanguageAgentRuntime for openclaw.
#
# Install:
#   kubectl apply -f runtimes/openclaw.yaml
#
# Usage in a LanguageAgent:
#   spec:
#     runtime: openclaw
#     models:
#       - name: claude-sonnet
#
# The runtime presets the image, port, workspace layout, init container,
# and env vars. Agents may override any field or append additional env/volumes.
#
# Prerequisites (per namespace):
#   kubectl create secret generic openclaw-gateway \
#     -n <namespace> \
#     --from-literal=OPENCLAW_GATEWAY_TOKEN=$(openssl rand -hex 32)
apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: openclaw
spec:
  image: ghcr.io/openclaw/openclaw:latest

  # openclaw gateway binds to loopback (ws://127.0.0.1:18789);
  # kubelet httpGet probes cannot reach it, so no liveness/readiness probes here.
  port: 18789

  workspace:
    size: 10Gi
    mountPath: /workspace

  deployment:
    initContainers:
      - name: openclaw-adapter
        image: ghcr.io/language-operator/openclaw-adapter:latest
        # MODEL_ENDPOINTS and LLM_MODEL are injected by the operator.
        # The adapter uses them to configure openclaw's provider settings.
        env:
          - name: OPENCLAW_STATE_DIR
            value: /workspace/.openclaw
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    env:
      - name: OPENCLAW_HOME
        value: /workspace   # openclaw uses $OPENCLAW_HOME/.openclaw as its state dir

    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
