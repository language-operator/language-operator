{{ template "header.html" . }}

<div class="theme-panel">
  {{ if .LoggedOut }}
  <h2 class="theme-heading">Signed out</h2>
  <p class="dex-subtle-text">You have been signed out.</p>
  {{ else }}
  <h2 class="theme-heading">No active session</h2>
  <p class="dex-subtle-text">There is no active session to sign out of.</p>
  {{ end }}

  {{ if .BackURL }}
  <div class="theme-form-row">
    <a href="{{ .BackURL }}" class="dex-subtle-text">&larr; Back to application</a>
  </div>
  {{ end }}
</div>

{{ template "footer.html" . }}
