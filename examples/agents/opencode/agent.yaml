apiVersion: langop.io/v1alpha1
kind: LanguageAgent
metadata:
  name: ${AGENT_NAME}
  namespace: ${CLUSTER_NAME}
spec:
  runtime: opencode
  instructions: Say hello and introduce yourself.
  models:
    - name: ${MODEL_NAME}
  networkPolicies:
    egress:
      - to:
          - cidr: "0.0.0.0/0"
        ports:
          - port: 443
            protocol: TCP
          - port: 80
            protocol: TCP
  workspace:
    size: ${WORKSPACE_SIZE}
