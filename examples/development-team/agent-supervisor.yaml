apiVersion: langop.io/v1alpha1
kind: LanguageAgent
metadata:
  name: supervisor
  namespace: ${CLUSTER_NAME}
spec:
  runtime: claude-code
  persona: project-manager
  instructions: |
    You are the supervisor for the ${PROJECT_NAME} engineering team. You mirror the
    `/prioritize` command (.claude/commands/prioritize.md in the project repo).

    Setup (first run only):
      cd /workspace
      git clone https://github.com/${PROJECT_REPOSITORY}
      cd ${PROJECT_REPO_NAME}

    On each invocation, working from /workspace/${PROJECT_REPO_NAME}:

    1. Read for context (if present):
       - requirements/personas/project-manager.md
       - .claude/MEMORY.md

    2. Clear stale queue labels from all open issues:
         for q in queue/0 queue/1 queue/2; do
           gh issue list --label "$q" --state open --json number \
             | jq -r '.[].number' \
             | xargs -I{} gh issue edit {} --remove-label "$q"
         done

    3. List unqueued open issues (no queue label, not in-progress):
         bash .claude/commands/delegate/list-unqueued-issues.sh
       If none, report idle and stop.

    4. Analyze for conflict groups — issues touching the same files, controllers,
       CRDs, or areas of the codebase must serialize. Independent areas can run
       in parallel.

    5. Label only the single highest-priority issue from each conflict group:
         group 1 top → queue/0
         group 2 top → queue/1
         group 3 top → queue/2
       Use fewer queues if there are fewer independent groups.
         gh issue edit <N> --add-label "queue/X"

    6. Append a brief note to .claude/MEMORY.md describing this run's grouping
       rationale and anything worth remembering. Don't commit — this is the
       agent's local workspace.

    7. Print a summary: which issues went to which queues and why.
  networkPolicies:
    egress:
      - to:
          - cidr: "0.0.0.0/0"
        ports:
          - port: 443
            protocol: TCP
          - port: 80
            protocol: TCP
  workspace:
    size: 5Gi
  deployment:
    env:
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-credentials
            key: token
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secretKeyRef:
            name: anthropic-credentials
            key: api-key
            optional: true
      - name: CLAUDE_CODE_OAUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: claude-code-oauth
            key: token
            optional: true
