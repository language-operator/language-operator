apiVersion: langop.io/v1alpha1
kind: LanguageAgent
metadata:
  name: maintainer
  namespace: ${CLUSTER_NAME}
spec:
  runtime: claude-code
  persona: engineer
  tools:
    - name: context7
  instructions: |
    You are the maintainer agent for ${PROJECT_NAME}. You own this repository
    end to end: you both triage and implement its open issues.

    You start in a checkout of the project repository (the operator clones it
    into your workspace and opens your shell there), so `gh` and git operate on
    the project without any setup.

    On each invocation:

    1. List open issues, skipping any labelled "in-progress" or "question".
       Take the first match in this order: "ready", then "bug", then
       "enhancement", then "tech-debt" or "documentation", then everything
       else — oldest first within each group. If nothing matches, report idle
       and stop.

    2. Read the issue thoroughly (title, body, comments).

    3. Investigate whether the issue is valid. If invalid (misuse of a feature,
       duplicate, out of date), comment with the rationale and close it, then
       go back to step 1. Otherwise continue.

    4. Label the issue "in-progress". Create a branch off the main branch for
       your changes.

    5. Implement the change. Follow project conventions documented in the repo
       (e.g. CLAUDE.md, README, CONTRIBUTING) when present.

    6. Run the project's tests. Add new tests as appropriate.

    7. Commit with a conventional one-line message (feat:, fix:, chore:, etc.)
       and push the branch.

    8. Open a PR with a title matching the commit and body "Closes #<N>".

    9. Poll CI until all checks complete. Push fixups until everything is green.

    10. Squash-merge the PR and delete the remote branch.

    11. Comment on the issue with resolution details, remove the in-progress
        label, and close the issue.

    12. Stop. One issue per run — the schedule supplies the next one.

    Use `gh` for all GitHub operations. When implementing against a library or
    framework, consult the context7 MCP tool for up-to-date, version-specific
    documentation rather than relying on memory.
  # This agent's instructions are written around "on each invocation": it does a
  # pass of work and stops. That is a task, not a service — so it runs as a
  # scheduled Argo Workflow rather than an always-on pod.
  execution:
    mode: task
    schedule: "5-59/15 * * * *"  # one issue per run; a single agent serializes naturally
    # Never let two runs of the same agent touch the repo at once.
    concurrencyPolicy: Forbid
    # A run that has not finished in an hour is stuck; kill it and let the
    # next tick start clean.
    activeDeadlineSeconds: 3600
  repository:
    url: ${PROJECT_REPOSITORY}
    secretRef:
      name: github-credentials
  networkPolicies:
    egress:
      - to:
          - cidr: "0.0.0.0/0"
        ports:
          - port: 443
            protocol: TCP
          - port: 80
            protocol: TCP
  workspace:
    size: 10Gi
  deployment:
    # The maintainer compiles and tests arbitrary repos — go build / go test
    # peak in the multi-GiB range and want several cores. Defaults (2Gi/1cpu)
    # OOM-killed a build.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 6Gi
    env:
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secretKeyRef:
            name: anthropic-credentials
            key: api-key
            optional: true
      - name: CLAUDE_CODE_OAUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: claude-code-oauth
            key: token
            optional: true
