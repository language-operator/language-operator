apiVersion: langop.io/v1alpha1
kind: LanguageAgent
metadata:
  name: maintainer
  namespace: ${CLUSTER_NAME}
spec:
  runtime: claude-code
  persona: engineer
  tools:
    - name: context7
  instructions: |
    You are the maintainer agent for ${PROJECT_NAME}. You own this repository
    end to end: you both triage and implement its open issues.

    You start in a checkout of the project repository (the operator clones it
    into your workspace and opens your shell there), so `gh` and git operate on
    the project without any setup.

    On each run, invoke the `langop:iterate` skill with the argument `--auto`.
    Always use that namespaced name, never a bare `/iterate`, so a leftover
    local copy cannot shadow it. `--auto` is the skill's unattended mode: it
    posts its plan as an issue comment instead of waiting for approval. The
    skill picks one issue and takes it from claim to merged PR to closed issue.
    It reads how to test a change from this repository's CLAUDE.md
    (`## Testing`), falling back to the repo's PR CI. Then stop: one issue per
    run, and the schedule supplies the next one.

    If the skill is not available, stop and say so. Do not improvise the loop
    yourself.

    When implementing against a library or framework, consult the context7 MCP
    tool for up-to-date, version-specific documentation rather than relying on
    memory.
  # Each run does one pass of /langop:iterate and stops. That is a task, not a
  # service, so it runs as a scheduled Argo Workflow rather than an always-on
  # pod. The claude-code task launcher (claude-code-adapter >= 0.1.10) installs
  # the langop plugin at the ref this repository pins in .claude/settings.json.
  execution:
    mode: task
    schedule: "5-59/15 * * * *"  # one issue per run; a single agent serializes naturally
    # Never let two runs of the same agent touch the repo at once.
    concurrencyPolicy: Forbid
    # A run that has not finished in an hour is stuck; kill it and let the
    # next tick start clean.
    activeDeadlineSeconds: 3600
  repository:
    url: ${PROJECT_REPOSITORY}
    secretRef:
      name: github-credentials
  networkPolicies:
    egress:
      - to:
          - cidr: "0.0.0.0/0"
        ports:
          - port: 443
            protocol: TCP
          - port: 80
            protocol: TCP
  workspace:
    size: 10Gi
  deployment:
    # The maintainer compiles and tests arbitrary repos — go build / go test
    # peak in the multi-GiB range and want several cores. Defaults (2Gi/1cpu)
    # OOM-killed a build.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 6Gi
    env:
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secretKeyRef:
            name: anthropic-credentials
            key: api-key
            optional: true
      - name: CLAUDE_CODE_OAUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: claude-code-oauth
            key: token
            optional: true
