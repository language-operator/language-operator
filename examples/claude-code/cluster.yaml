# Replace <your-domain> with a domain you control — agents will be accessible at
# my-agent.<your-domain> and Dex at auth.<your-domain>.
#
# The default password for the local user below is "password".
# Change the hash before deploying to a shared or production cluster.
# Generate a new hash: htpasswd -nbBC 10 "" <password> | tr -d ':\n' | sed 's/$2y/$2a/'
apiVersion: langop.io/v1alpha1
kind: LanguageCluster
metadata:
  name: claude-code
spec:
  domain: demo.langop.io
  auth:
    enabled: true
    oidc:
      dex:
        enablePasswordDB: true
        staticPasswords:
          - email: user@example.com
            # bcrypt hash of "password" (cost 10)
            hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
            username: user
            userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
