apiVersion: langop.io/v1alpha1
kind: LanguageTool
metadata:
  name: ${TOOL_NAME}
  namespace: ${CLUSTER_NAME}
spec:
  # The GitHub MCP server ships as a stdio program. transport=stdio tells the operator to run
  # it under a pinned, persistent stdio→Streamable-HTTP bridge that serves /mcp on spec.port —
  # the only transport the operator's schema discovery speaks. No bridge/cache wiring needed here.
  transport: stdio
  port: 8080
  stdio:
    command:
      - npx
      - -y
      - "@modelcontextprotocol/server-github"
  deployment:
    # The Node MCP server grows past the operator's 512Mi default and gets OOMKilled;
    # give it 1Gi of headroom.
    resources:
      limits:
        memory: 1Gi
    env:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-mcp-credentials
            key: token
  # The operator's default tool policy denies external egress. npx fetches the server package
  # from the npm registry and the server calls the GitHub API at runtime — both public HTTPS.
  networkPolicies:
    egress:
      - to:
          - cidr: "0.0.0.0/0"
        ports:
          - port: 443
            protocol: TCP
