---
# Example: deploying openclaw via language-operator
#
# The LanguageModel CR registers a LiteLLM proxy. The operator resolves the
# proxy endpoint and injects MODEL_ENDPOINTS into all containers (including
# init containers). The openclaw-adapter reads MODEL_ENDPOINTS and seeds
# openclaw.json so openclaw routes LLM traffic through the proxy rather than
# connecting to model APIs directly.
#
# Prerequisites:
#
#   kubectl create secret generic anthropic-credentials \
#     -n language-operator-openclaw \
#     --from-literal=api-key=sk-ant-...
#
#   kubectl create secret generic openclaw-gateway \
#     -n language-operator-openclaw \
#     --from-literal=OPENCLAW_GATEWAY_TOKEN=$(openssl rand -hex 32)

---
apiVersion: langop.io/v1alpha1
kind: LanguageCluster
metadata:
  name: language-operator-openclaw
spec:
  domain: agents.example.com

---
apiVersion: langop.io/v1alpha1
kind: LanguageModel
metadata:
  name: claude-sonnet
  namespace: language-operator-openclaw
spec:
  provider: anthropic
  modelName: claude-sonnet-4-5
  apiKeySecretRef:
    name: anthropic-credentials
    key: api-key

---
apiVersion: langop.io/v1alpha1
kind: LanguageAgent
metadata:
  name: openclaw
  namespace: language-operator-openclaw
spec:
  image: ghcr.io/openclaw/openclaw:latest
  port: 18789
  models:
    - name: claude-sonnet

  initContainers:
    - name: openclaw-adapter
      image: ghcr.io/language-operator/openclaw-adapter:latest
      # MODEL_ENDPOINTS and LLM_MODEL are injected by the operator.
      # The adapter uses them to configure openclaw's provider settings.
      env:
        - name: OPENCLAW_STATE_DIR
          value: /workspace/.openclaw
      volumeMounts:
        - name: workspace
          mountPath: /workspace

  # livenessProbe / readinessProbe omitted: openclaw gateway binds to loopback
  # (ws://127.0.0.1:18789), so kubelet httpGet probes cannot reach it.
  # Add probes back once openclaw exposes a health endpoint on 0.0.0.0.

  env:
    - name: OPENCLAW_HOME
      value: /workspace   # openclaw uses $OPENCLAW_HOME/.openclaw as its state dir

  envFrom:
    - secretRef:
        name: openclaw-gateway   # OPENCLAW_GATEWAY_TOKEN

  workspace:
    enabled: true
    size: 10Gi

  executionMode: autonomous
  replicas: 1

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 1000m
