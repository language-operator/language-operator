# Two LanguageModels with the same modelName: agents call the gateway by
# modelName, so LiteLLM serves both as one model group and load-balances
# requests across the two endpoints. Admission warns that the name is shared;
# that is expected here.
apiVersion: langop.io/v1alpha1
kind: LanguageModel
metadata:
  name: llama-gpu-a
  namespace: my-cluster
spec:
  provider: openai-compatible
  modelName: llama3.2
  endpoint: http://ollama-a.inference.svc.cluster.local:11434/v1
  timeout: "5m"
---
apiVersion: langop.io/v1alpha1
kind: LanguageModel
metadata:
  name: llama-gpu-b
  namespace: my-cluster
spec:
  provider: openai-compatible
  modelName: llama3.2
  endpoint: http://ollama-b.inference.svc.cluster.local:11434/v1
  timeout: "5m"
