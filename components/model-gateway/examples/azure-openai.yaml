apiVersion: langop.io/v1alpha1
kind: LanguageModel
metadata:
  name: azure-gpt4
  namespace: langop-system
spec:
  provider: azure
  modelName: gpt-4-deployment
  endpoint: https://your-resource.openai.azure.com/
  apiKeySecretRef:
    name: azure-openai-credentials
    key: api-key
  timeout: "5m"
  rateLimits:
    requestsPerMinute: 120
    tokensPerMinute: 150000
  # Network egress rules (required for Cilium/NetworkPolicy enforcement)
  networkPolicies:
  - description: "Allow Azure OpenAI API access"
    to:
      dns: ["*.openai.azure.com"]
    ports:
    - port: 443
      protocol: TCP
