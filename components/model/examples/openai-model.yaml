apiVersion: langop.io/v1alpha1
kind: LanguageModel
metadata:
  name: gpt-4-turbo
  namespace: langop-system
spec:
  provider: openai
  modelName: gpt-4-turbo-preview
  apiKeySecretRef:
    name: openai-credentials
    key: api-key
  timeout: "5m"
  rateLimits:
    requestsPerMinute: 100
    tokensPerMinute: 100000
