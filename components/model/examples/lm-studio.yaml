apiVersion: langop.io/v1alpha1
kind: LanguageModel
metadata:
  name: lm-studio-local
  namespace: langop-system
spec:
  # Provider type for OpenAI-compatible API
  provider: openai-compatible

  # Model identifier (as configured in LM Studio)
  modelName: llama-3.2-3b-instruct

  # LM Studio endpoint (typically on local network)
  endpoint: http://192.168.1.100:1234/v1

  # No API key needed for LM Studio
  # apiKeySecretRef: null

  # Request timeout (local models can be slow)
  timeout: "20m"

  # Rate limiting (generous for local use)
  rateLimits:
    requestsPerMinute: 300
    concurrentRequests: 25

  # Retry policy (minimal for local)
  retryPolicy:
    maxAttempts: 2
    initialBackoff: "500ms"
    maxBackoff: "5s"

  # Model configuration
  configuration:
    temperature: 0.8
    maxTokens: 4096
    topP: 0.9
    additionalParameters:
      # LM Studio specific settings
      stream: "true"
      stop: ["</s>", "<|im_end|>"]

  # Response caching (useful for local models)
  caching:
    enabled: true
    ttl: "15m"
    backend: memory
    maxSize: 1024  # MB

  # Observability
  observability:
    metrics: true
    logging:
      level: info
      logRequests: true

  # Cost tracking (free for local!)
  costTracking:
    enabled: false

  # Network egress rules for LM Studio on local network
  networkPolicies:
  - description: "Allow LM Studio API access"
    to:
      cidr: "192.168.1.0/24"  # Adjust to your local network range
    ports:
    - port: 1234
      protocol: TCP