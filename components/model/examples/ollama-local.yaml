apiVersion: langop.io/v1alpha1
kind: LanguageModel
metadata:
  name: ollama-llama3
  namespace: langop-system
spec:
  provider: openai-compatible
  modelName: llama3.2
  endpoint: http://ollama.default.svc.cluster.local:11434/v1
  # No API key needed for local Ollama
  timeout: "15m"
  rateLimits:
    requestsPerMinute: 200
