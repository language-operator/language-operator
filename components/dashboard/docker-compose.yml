version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: language_operator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Language Operator Dashboard
  dashboard:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    network_mode: "host"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/language_operator?schema=public"
      NEXTAUTH_SECRET: "your-nextauth-secret-change-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: "development"
      # Kubernetes configuration - use local kubeconfig
      KUBECONFIG: "/root/.kube/config"
    volumes:
      - ~/.kube:/root/.kube:ro
      # Mount source code for development
      - type: bind
        source: ./src
        target: /app/src
      # Mount for development (optional)
      - type: bind
        source: ./prisma
        target: /app/prisma
        read_only: true

volumes:
  postgres_data: