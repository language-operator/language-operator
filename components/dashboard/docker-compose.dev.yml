version: '3.8'

services:
  # Database for development
  postgres-dev:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: language_operator_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./prisma/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development dashboard (with hot reload)
  dashboard-dev:
    build:
      context: .
      target: deps
    restart: always
    environment:
      DATABASE_URL: "postgresql://dev:dev@postgres-dev:5432/language_operator_dev?schema=public"
      NEXTAUTH_SECRET: "dev-secret-not-for-production"
      NEXTAUTH_URL: "http://localhost:3001"
      NODE_ENV: "development"
    ports:
      - "3001:3000"
    depends_on:
      postgres-dev:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./
        target: /app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_dev_data: