site_name: Language Operator
site_description: Kubernetes operator that runs AI agents as native workloads
site_author: Language Operator Contributors
site_url: https://language-operator.github.io/language-operator

repo_name: language-operator/language-operator
repo_url: https://github.com/language-operator/language-operator

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Documentation:
    - Introduction: index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - MCP: getting-started/mcp.md
    - Components:
        - Clusters: components/clusters.md
        - Agents: components/agents.md
        - Tools: components/tools.md
        - Models: components/models.md
        - Personas: components/personas.md
        - Runtimes: components/runtimes.md
    - Guides:
        - Kubernetes: guides/cluster-setup.md
        - OpenClaw: guides/openclaw.md
        - OpenCode: guides/opencode.md
        - Claude Code: guides/claude-code.md
        - Custom Agents: guides/custom-agents.md
  - CRD Reference: api/reference.md
  - Development:
      - Contributing: development/contributing.md
      - Development Setup: development/setup.md
      - Testing: development/testing.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/language-operator/language-operator
  version:
    provider: mike
