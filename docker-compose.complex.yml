services:
  # ClickHouse for telemetry data storage
  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    restart: always
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse:/etc/clickhouse-server/config.d
    networks:
      - langop-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    restart: always
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000
      CLICKHOUSE_DATABASE: otel
      CLICKHOUSE_USERNAME: default
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "13133:13133" # Health check endpoint
    volumes:
      - ./config/otel-collector:/etc/otelcol-contrib
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - langop-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database for development
  postgres-dev:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: language_operator_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d language_operator_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langop-dev

  # Kind Kubernetes cluster
  kind-cluster:
    image: kindest/node:v1.27.3
    privileged: true
    restart: always
    environment:
      KUBECONFIG: /etc/kubernetes/admin.conf
    ports:
      - "6443:6443"  # Kubernetes API
      - "30080:30080" # HTTP ingress 
      - "30443:30443" # HTTPS ingress
    volumes:
      - /var/lib/docker
      - kind_data:/var/lib/docker-host
      - ./src/config:/operator-config:ro
      - ./scripts:/scripts:ro
    networks:
      - langop-dev
    healthcheck:
      test: ["CMD-SHELL", "kubectl get nodes --kubeconfig /etc/kubernetes/admin.conf"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    command: >
      sh -c "
        # Start Kind cluster
        /usr/local/bin/entrypoint.sh &
        CLUSTER_PID=$$!
        
        # Wait for cluster to be ready
        echo 'Waiting for Kubernetes to start...'
        sleep 60
        
        # Run setup script
        if [ -f /scripts/setup-dev-cluster.sh ]; then
          echo 'Setting up development cluster...'
          /scripts/setup-dev-cluster.sh
        fi
        
        # Keep running
        wait $$CLUSTER_PID
      "

  # Language Operator Controller
  language-operator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      KUBECONFIG: /tmp/kubeconfig
      KUBERNETES_SERVICE_HOST: kind-cluster
      KUBERNETES_SERVICE_PORT: "6443"
      # OpenTelemetry configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "language-operator"
      # Telemetry adapter configuration
      TELEMETRY_ADAPTER_TYPE: "clickhouse"
      TELEMETRY_ADAPTER_ENDPOINT: "http://clickhouse:8123"
      TELEMETRY_ADAPTER_DATABASE: "otel"
      TELEMETRY_ADAPTER_USERNAME: "default"
    depends_on:
      kind-cluster:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    volumes:
      - ./src:/workspace:ro
      - operator_kube:/tmp
    networks:
      - langop-dev
    command: >
      sh -c "
        # Create kubeconfig for Kind cluster
        cat > /tmp/kubeconfig << 'EOF'
        apiVersion: v1
        kind: Config
        clusters:
        - cluster:
            server: https://kind-cluster:6443
            insecure-skip-tls-verify: true
          name: kind-cluster
        contexts:
        - context:
            cluster: kind-cluster
            user: kind-user
          name: kind-cluster
        current-context: kind-cluster
        users:
        - name: kind-user
          user:
            username: admin
            password: admin
        EOF
        
        echo 'Starting Language Operator...'
        /workspace/bin/manager
      "

  # Development dashboard (with hot reload)
  dashboard-dev:
    build:
      context: ./components/dashboard
      target: build-deps
    restart: always
    environment:
      DATABASE_URL: "postgresql://dev:dev@postgres-dev:5432/language_operator_dev?schema=public"
      NEXTAUTH_SECRET: "dev-secret-not-for-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: "development"
      # Kubernetes configuration for kind cluster
      KUBERNETES_SERVER_URL: "https://kind-cluster:6443"
      KUBERNETES_SKIP_TLS_VERIFY: "true"
      KUBECONFIG: "/app/.kube/config"
      # OpenTelemetry configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "dashboard-dev"
      # Telemetry adapter configuration
      TELEMETRY_ADAPTER_TYPE: "clickhouse"
      TELEMETRY_ADAPTER_ENDPOINT: "http://clickhouse:8123"
      TELEMETRY_ADAPTER_DATABASE: "otel"
      TELEMETRY_ADAPTER_USERNAME: "default"
    ports:
      - "3000:3000"
    depends_on:
      postgres-dev:
        condition: service_healthy
      language-operator:
        condition: service_started
      otel-collector:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./components/dashboard
        target: /app
      - /app/node_modules
      - /app/.next
      # Create kubeconfig for kind cluster
      - dashboard_kube:/app/.kube
    networks:
      - langop-dev
    command: >
      sh -c "
        mkdir -p /app/.kube && 
        echo 'Waiting for kind cluster...' &&
        sleep 30 &&
        echo 'Generating kubeconfig...' &&
        cat > /app/.kube/config << 'EOF'
        apiVersion: v1
        kind: Config
        clusters:
        - cluster:
            server: https://kind-cluster:6443
            insecure-skip-tls-verify: true
          name: kind-cluster
        contexts:
        - context:
            cluster: kind-cluster
            user: kind-user
          name: kind-cluster
        current-context: kind-cluster
        users:
        - name: kind-user
          user:
            username: admin
            password: admin
        EOF
        npx prisma generate && npm run dev
      "

  # Prisma Studio for database management
  prisma-studio:
    build:
      context: ./components/dashboard
      target: build-deps
    restart: always
    environment:
      DATABASE_URL: "postgresql://dev:dev@postgres-dev:5432/language_operator_dev?schema=public"
    ports:
      - "5555:5555"
    depends_on:
      postgres-dev:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./components/dashboard
        target: /app
      - /app/node_modules
    networks:
      - langop-dev
    command: sh -c "npx prisma generate && npx prisma studio --port 5555 --hostname 0.0.0.0"

volumes:
  postgres_dev_data:
  kind_data:
  dashboard_kube:
  operator_kube:
  clickhouse_data:

networks:
  langop-dev:
    driver: bridge