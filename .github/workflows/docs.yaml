name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/api/v1alpha1/**'
      - 'src/.crd-ref-docs.yaml'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/api/v1alpha1/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install crd-ref-docs
        run: |
          go install github.com/elastic/crd-ref-docs@latest

      - name: Generate CRD API Reference
        run: |
          cd src
          crd-ref-docs \
            --source-path=api/v1alpha1 \
            --config=.crd-ref-docs.yaml \
            --renderer=markdown \
            --output-path=../docs/api-generated.md

      - name: Create API Reference Page
        run: |
          # Copy the full generated API reference to a complete page
          cp docs/api-generated.md docs/api/reference.md

          # Update navigation to use the complete reference
          # Individual CRD pages will link to sections in the full reference

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build MkDocs site
        run: |
          uv run mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: docs
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: update documentation site'

      - name: Deploy root redirect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=/docs/">
            <link rel="canonical" href="/docs/">
          </head>
          <body>
            <p>Redirecting to <a href="/docs/">docs</a>...</p>
          </body>
          </html>
          HTML
          echo "langop.io" > redirect/CNAME

      - name: Publish root redirect to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: update root redirect'

      - name: Upload artifact for PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: ./site
          retention-days: 7
