{{- if .Values.runtimes.claudeCode.enabled -}}
apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: claude-code
  labels:
    {{- include "language-operator-runtimes.labels" . | nindent 4 }}
spec:
  # Single combined image used by both the init container (seed-config.mjs)
  # and the main container (server.mjs WebSocket terminal).
  image: ghcr.io/language-operator/claude-code-adapter:latest

  # Agents using this runtime sit behind the cluster OIDC proxy (when the cluster enables auth).
  # Claude Code authentication itself is interactive (run /login in the terminal); no credentials here.
  auth:
    enabled: true

  ports:
    - name: http
      port: 8080
      protocol: TCP
      expose: true

  workspace:
    size: 10Gi
    mountPath: /workspace

  deployment:
    {{- if .Values.runtimes.claudeCode.imagePullPolicy }}
    imagePullPolicy: {{ .Values.runtimes.claudeCode.imagePullPolicy }}
    {{- end }}
    initContainers:
      - name: claude-code-adapter
        image: ghcr.io/language-operator/claude-code-adapter:latest
        {{- if .Values.runtimes.claudeCode.imagePullPolicy }}
        imagePullPolicy: {{ .Values.runtimes.claudeCode.imagePullPolicy }}
        {{- end }}
        # Override the image's default entrypoint (which runs the server)
        # so this init container runs seed-config.mjs once and exits.
        # MODEL_ENDPOINT, LLM_MODEL, and AGENT_NAME are injected by the operator.
        command: ["node", "/app/seed-config.mjs"]
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    startupProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30

    livenessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3

    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

    env:
      - name: CLAUDE_CONFIG_DIR
        value: /workspace/.claude   # Persist credentials, sessions, projects on the PVC

    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
{{- end }}
