{{- if .Values.runtimes.claudeCode.enabled -}}
apiVersion: langop.io/v1alpha1
kind: LanguageAgentRuntime
metadata:
  name: claude-code
  labels:
    {{- include "language-operator-runtimes.labels" . | nindent 4 }}
spec:
  image: ghcr.io/language-operator/claude-code-server:latest

  ports:
    - name: http
      port: 8080
      protocol: TCP
      expose: true

  workspace:
    size: 10Gi
    mountPath: /workspace

  deployment:
    initContainers:
      - name: claude-code-adapter
        image: ghcr.io/language-operator/claude-code-adapter:latest
        {{- if .Values.runtimes.claudeCode.imagePullPolicy }}
        imagePullPolicy: {{ .Values.runtimes.claudeCode.imagePullPolicy }}
        {{- end }}
        # MODEL_ENDPOINT and LLM_MODEL are injected by the operator.
        # AGENT_NAME is injected by the operator for agent card identity.
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    startupProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30

    livenessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3

    readinessProbe:
      tcpSocket:
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

    env:
      - name: CLAUDE_CONFIG_DIR
        value: /workspace/.claude   # Persist credentials, sessions, projects on the PVC

    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
{{- end }}
