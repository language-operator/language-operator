# Standard runtimes bundled with the operator.
# LanguageAgentRuntime resources are cluster-scoped; install once, use from any namespace.
# Requires the language-operator chart (with CRDs) to be installed first.
runtimes:
  openclaw:
    # Install the openclaw LanguageAgentRuntime.
    enabled: true
  opencode:
    # Install the opencode LanguageAgentRuntime.
    enabled: true
  claudeCode:
    # Install the claude-code LanguageAgentRuntime.
    enabled: true
    # imagePullPolicy for the claude-code-adapter and claude-code-server images.
    # Set to Never in local development (values.local.yaml) to use locally imported images.
    imagePullPolicy: ""
