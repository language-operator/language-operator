# Umbrella chart aggregating the standard Language Operator runtimes.
# Each runtime is a subchart pulled from oci://ghcr.io/language-operator/charts.
# LanguageAgentRuntime resources are cluster-scoped; install once, use from any
# namespace. Requires the language-operator chart (with CRDs) installed first.
#
# Values under each runtime key are forwarded to that subchart. See the subchart
# repos for the full set of overridable values:
#   - https://github.com/language-operator/claude-code-adapter
#   - https://github.com/language-operator/openclaw-adapter
#   - https://github.com/language-operator/opencode-adapter
#   - https://github.com/language-operator/deepagents-adapter

claude-code:
  # Install the claude-code LanguageAgentRuntime.
  enabled: true

openclaw:
  # Install the openclaw LanguageAgentRuntime.
  enabled: true

opencode:
  # Install the opencode LanguageAgentRuntime.
  enabled: true

deepagents:
  # Install the deepagents LanguageAgentRuntime.
  enabled: true
