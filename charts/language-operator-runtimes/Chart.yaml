apiVersion: v2
name: language-operator-runtimes
description: Umbrella chart bundling the Language Operator runtimes (openclaw, opencode, claude-code, deepagents) as subcharts
type: application
version: 0.1.132
appVersion: "0.1.132"
keywords:
  - ai
  - llm
  - language-models
  - agents
home: https://github.com/language-operator/language-operator
sources:
  - https://github.com/language-operator/language-operator
maintainers:
  - name: James Ryan
    email: james@theryans.io

# Each runtime now lives in its own repository and publishes a self-contained
# chart to oci://ghcr.io/language-operator/charts. This chart simply aggregates
# them; toggle individual runtimes via the `<runtime>.enabled` values.
dependencies:
  - name: claude-code
    version: "0.1.3"
    repository: oci://ghcr.io/language-operator/charts
    condition: claude-code.enabled
  - name: openclaw
    version: "0.1.0"
    repository: oci://ghcr.io/language-operator/charts
    condition: openclaw.enabled
  - name: opencode
    version: "0.1.3"
    repository: oci://ghcr.io/language-operator/charts
    condition: opencode.enabled
  - name: deepagents
    version: "0.1.0"
    repository: oci://ghcr.io/language-operator/charts
    condition: deepagents.enabled
