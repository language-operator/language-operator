  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - workflows/status
  - cronworkflows/status
  verbs:
  - get
# Granted so the operator can in turn grant it to each agent's ServiceAccount:
# the Argo executor reports node outcomes as WorkflowTaskResults, and RBAC forbids
# granting a permission the granter does not hold.
- apiGroups:
  - argoproj.io
  resources:
  - workflowtaskresults
  verbs:
  - create
