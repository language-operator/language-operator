apiVersion: v2
name: language-operator
description: A Kubernetes operator for managing language models, tools, agents, personas, and clients
type: application
version: 0.3.2
appVersion: "0.3.2"
keywords:
  - ai
  - llm
  - language-models
  - agents
  - mcp
home: https://github.com/language-operator/language-operator
sources:
  - https://github.com/language-operator/language-operator
maintainers:
  - name: James Ryan
    email: james@theryans.io

# Agents run as Argo Workflows, so the operator requires the argoproj.io CRDs and
# the workflow controller. Bundled by default; set `argo-workflows.enabled: false`
# to point at an Argo installation you manage yourself.
# Pulled as OCI (like charts/language-operator-runtimes) so no `helm repo add` is
# needed to resolve it — `helm dependency build` works on a clean checkout.
dependencies:
  - name: argo-workflows
    version: "2.0.3"
    repository: oci://ghcr.io/argoproj/argo-helm
    condition: argo-workflows.enabled
