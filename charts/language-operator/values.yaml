# Default values for language-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/language-operator/language-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Network isolation configuration
# Controls whether NetworkPolicy resources are created for security isolation
networkIsolation:
  # Enable/disable NetworkPolicy creation for all Language Operator resources
  # When disabled, no NetworkPolicy resources will be created, allowing unrestricted network access
  # When enabled, strict network isolation is enforced for agents, tools, and models
  enabled: true

# ServiceAccount configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Service configuration
service:
  type: ClusterIP
  metricsPort: 8443  # controls both the Service port and the --metrics-bind-address flag
  annotations: {}

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
  initialDelaySeconds: 15
  periodSeconds: 20

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity and anti-affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - language-operator
        topologyKey: kubernetes.io/hostname

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Operator configuration
config:
  # Leader election configuration
  leaderElection:
    enabled: true
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s

  # Health probe configuration
  health:
    port: 8081

  # Webhook configuration
  webhook:
    enabled: true
    port: 9443
    certDir: /tmp/k8s-webhook-server/serving-certs
    # cert-manager integration for webhook TLS certificate provisioning.
    # When enabled, creates cert-manager Certificate and Issuer resources and
    # annotates webhook configurations for CA injection.
    # Requires cert-manager v1.12+ to be installed in the cluster.
    # Set to false if you manage webhook TLS certificates yourself.
    certManager:
      enabled: true

  # Logging configuration
  logging:
    level: info
    format: json
    development: false

  # Controller configuration
  controller:
    # Number of concurrent reconcilers per controller
    concurrency: 5
    # Sync period for controller
    syncPeriod: 10m

  # Network policy configuration for agent pods
  # These settings control NetworkPolicy rules applied to LanguageAgent, LanguageTool, and LanguageModel pods
  networkPolicy:
    # Kubernetes API server CIDR ranges for agent pod access
    # These CIDRs allow agent pods to reach the Kubernetes API server for event emission and learning integration
    # Configure these to match your cluster's network topology
    apiServerCIDRs:
      # Common cluster service networks where API servers typically reside
      - "10.0.0.0/8"        # Covers most kubeadm clusters (10.96.0.1), k3s (10.43.0.1)
      - "172.16.0.0/12"     # Docker default bridge network, some managed clusters
      - "192.168.0.0/16"    # Local/dev clusters, some node networks
      
    # Additional custom CIDR ranges (empty by default)
    # Use this to add specific network ranges for your environment
    # Example:
    #   - "203.0.113.0/24"  # External API server network
    #   - "198.51.100.0/24" # Load balancer network
    customCIDRs: []

    # Fail operator startup if CNI does not support NetworkPolicy enforcement.
    # Set to true in production clusters where NetworkPolicy enforcement is required.
    requireNetworkPolicy: false

    # Timeout for CNI detection and NetworkPolicy operations.
    timeout: 30s

    # Number of retry attempts for NetworkPolicy operations.
    retries: 3

  agents:
    # Default IngressClass for agent Ingress resources.
    # Can be overridden per-cluster via LanguageCluster spec.ingress.className.
    # Example: "traefik", "nginx", "alb"
    ingressClassName: ""
    # Namespace the ingress controller runs in.
    # Auto-detected from the ingressClassName at startup (via IngressClass annotation or pod label scan).
    # Set explicitly to override auto-detection.
    # Example: "traefik", "ingress-nginx"
    ingressControllerNamespace: ""
    # Default StorageClass for agent workspace PVCs.
    # When empty, the cluster default StorageClass is used.
    # Can be overridden per-agent via spec.workspace.storageClassName.
    # Example: "local-path", "standard", "gp2"
    storageClassName: ""

  gateway:
    # Image for the shared LiteLLM gateway deployed per LanguageCluster.
    # Defaults to ghcr.io/language-operator/model-gateway:latest when empty.
    image: ""
    # ImagePullPolicy for the gateway (Always, IfNotPresent, Never).
    # Defaults to Kubernetes default (IfNotPresent, or Always for :latest).
    imagePullPolicy: ""
    # Default IngressClass for the gateway Ingress.
    # Can be overridden per-cluster via LanguageCluster spec.ingress.className.
    # Example: "traefik", "nginx", "alb"
    ingressClassName: ""

  tls:
    # cert-manager issuer name for gateway and agent Ingress TLS certificates.
    # Set to "" to disable cert-manager integration (e.g. when supplying certificates manually).
    certificateIssuerName: ""
    # Kind of the cert-manager issuer: ClusterIssuer (default) or Issuer.
    certificateIssuerKind: "ClusterIssuer"

  # Watch configuration
  watch:
    # Namespaces to watch (empty means all namespaces)
    namespaces: []

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# Monitoring configuration
monitoring:
  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    # Namespace where ServiceMonitor will be created (defaults to release namespace)
    namespace: ""
    # Additional labels for ServiceMonitor
    labels: {}
    # Interval at which metrics should be scraped
    interval: 30s
    # Timeout for scraping
    scrapeTimeout: 10s

# CRD installation
crds:
  # Install CRDs as part of the Helm chart
  install: true
  # Keep CRDs on chart uninstall
  keep: true
  # Annotations to add to CRDs
  annotations: {}

# Additional volumes
volumes: []
# - name: tmp
#   emptyDir: {}

# Additional volume mounts
volumeMounts: []
# - name: tmp
#   mountPath: /tmp

# Extra environment variables
env: []

# Extra environment variables from ConfigMap or Secret
envFrom: []
# - configMapRef:
#     name: my-config
# - secretRef:
#     name: my-secret

# Priority class name
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: language-operator

# Pod labels
podLabels: {}

# Service labels
serviceLabels: {}
